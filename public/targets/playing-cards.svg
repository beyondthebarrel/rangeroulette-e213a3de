<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8.5 11" width="8.5in" height="11in">
  <rect x="0" y="0" width="8.5" height="11" fill="#ffffff"/>

  <text x="4.25" y="0.55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.34" font-weight="700" fill="#111111">PLAYING CARD TARGETS</text>
  <text x="4.25" y="0.82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.15" fill="#555555">Actual card size (2.5"×3.5") — cut apart along the card borders</text>

  <!-- Row 1 -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <!-- A-S -->
    <rect x="0.5" y="1.7" width="2.5" height="3.5" fill="none" stroke="#111111" stroke-width="0.03"/>
    <text x="0.75" y="2.2" font-size="0.4" font-weight="700">A</text>
    <text x="0.75" y="2.55" font-size="0.35">&#9824;</text>
    <text x="2.75" y="4.85" font-size="0.4" font-weight="700" text-anchor="end">A</text>
    <text x="2.75" y="4.5" font-size="0.35" text-anchor="end">&#9824;</text>
    <text x="1.75" y="3.65" font-size="1.3" text-anchor="middle">&#9824;</text>

    <!-- K-H -->
    <rect x="3.0" y="1.7" width="2.5" height="3.5" fill="none" stroke="#111111" stroke-width="0.03"/>
    <text x="3.25" y="2.2" font-size="0.4" font-weight="700">K</text>
    <text x="3.25" y="2.55" font-size="0.35">&#9829;</text>
    <text x="5.25" y="4.85" font-size="0.4" font-weight="700" text-anchor="end">K</text>
    <text x="5.25" y="4.5" font-size="0.35" text-anchor="end">&#9829;</text>
    <text x="4.25" y="3.65" font-size="1.3" text-anchor="middle">&#9829;</text>

    <!-- Q-D -->
    <rect x="5.5" y="1.7" width="2.5" height="3.5" fill="none" stroke="#111111" stroke-width="0.03"/>
    <text x="5.75" y="2.2" font-size="0.4" font-weight="700">Q</text>
    <text x="5.75" y="2.55" font-size="0.35">&#9830;</text>
    <text x="7.75" y="4.85" font-size="0.4" font-weight="700" text-anchor="end">Q</text>
    <text x="7.75" y="4.5" font-size="0.35" text-anchor="end">&#9830;</text>
    <text x="6.75" y="3.65" font-size="1.3" text-anchor="middle">&#9830;</text>
  </g>

  <!-- Row 2 -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <!-- J-C -->
    <rect x="0.5" y="5.2" width="2.5" height="3.5" fill="none" stroke="#111111" stroke-width="0.03"/>
    <text x="0.75" y="5.7" font-size="0.4" font-weight="700">J</text>
    <text x="0.75" y="6.05" font-size="0.35">&#9827;</text>
    <text x="2.75" y="8.35" font-size="0.4" font-weight="700" text-anchor="end">J</text>
    <text x="2.75" y="8.0" font-size="0.35" text-anchor="end">&#9827;</text>
    <text x="1.75" y="7.15" font-size="1.3" text-anchor="middle">&#9827;</text>

    <!-- 10-S -->
    <rect x="3.0" y="5.2" width="2.5" height="3.5" fill="none" stroke="#111111" stroke-width="0.03"/>
    <text x="3.25" y="5.7" font-size="0.34" font-weight="700">10</text>
    <text x="3.25" y="6.05" font-size="0.35">&#9824;</text>
    <text x="5.25" y="8.35" font-size="0.34" font-weight="700" text-anchor="end">10</text>
    <text x="5.25" y="8.0" font-size="0.35" text-anchor="end">&#9824;</text>
    <text x="4.25" y="7.15" font-size="1.3" text-anchor="middle">&#9824;</text>

    <!-- 9-H -->
    <rect x="5.5" y="5.2" width="2.5" height="3.5" fill="none" stroke="#111111" stroke-width="0.03"/>
    <text x="5.75" y="5.7" font-size="0.4" font-weight="700">9</text>
    <text x="5.75" y="6.05" font-size="0.35">&#9829;</text>
    <text x="7.75" y="8.35" font-size="0.4" font-weight="700" text-anchor="end">9</text>
    <text x="7.75" y="8.0" font-size="0.35" text-anchor="end">&#9829;</text>
    <text x="6.75" y="7.15" font-size="1.3" text-anchor="middle">&#9829;</text>
  </g>

  <text x="4.25" y="9.15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.14" fill="#555555">Staple to a backer or clip to a stand — each card is a full-size aim point</text>

  <line x1="0.5" y1="10.42" x2="1.5" y2="10.42" stroke="#111111" stroke-width="0.02"/>
  <line x1="0.5" y1="10.36" x2="0.5" y2="10.48" stroke="#111111" stroke-width="0.02"/>
  <line x1="1.5" y1="10.36" x2="1.5" y2="10.48" stroke="#111111" stroke-width="0.02"/>
  <text x="1.0" y="10.62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.12" fill="#555555">1 IN — verify scale before use</text>

  <text x="4.25" y="10.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.12" fill="#777777">Range Roulette · Beyond The Barrel Concepts</text>
  <text x="4.25" y="10.96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.11" fill="#999999">Print at 100% / Actual Size — do not "fit to page"</text>
</svg>
