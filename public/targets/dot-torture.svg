<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8.5 11" width="8.5in" height="11in">
  <rect x="0" y="0" width="8.5" height="11" fill="#ffffff"/>

  <text x="4.25" y="0.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.26" font-weight="700" fill="#111111">DOT TORTURE TARGET</text>
  <text x="4.25" y="0.48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.12" fill="#555555">10 strings, 1 dot each, 2" diameter — recommended distance 3-5 yards</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="0.65" font-weight="700" fill="#111111" text-anchor="middle" stroke="#111111" stroke-width="0.03">
    <circle cx="1.95" cy="1.65" r="1.0" fill="none"/>
    <circle cx="4.25" cy="1.65" r="1.0" fill="none"/>
    <circle cx="6.55" cy="1.65" r="1.0" fill="none"/>
    <circle cx="1.95" cy="3.9" r="1.0" fill="none"/>
    <circle cx="4.25" cy="3.9" r="1.0" fill="none"/>
    <circle cx="6.55" cy="3.9" r="1.0" fill="none"/>
    <circle cx="1.95" cy="6.15" r="1.0" fill="none"/>
    <circle cx="4.25" cy="6.15" r="1.0" fill="none"/>
    <circle cx="6.55" cy="6.15" r="1.0" fill="none"/>
    <circle cx="4.25" cy="8.4" r="1.0" fill="none"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="0.65" font-weight="700" fill="#111111" text-anchor="middle" stroke="none">
    <text x="1.95" y="1.87">1</text>
    <text x="4.25" y="1.87">2</text>
    <text x="6.55" y="1.87">3</text>
    <text x="1.95" y="4.12">4</text>
    <text x="4.25" y="4.12">5</text>
    <text x="6.55" y="4.12">6</text>
    <text x="1.95" y="6.37">7</text>
    <text x="4.25" y="6.37">8</text>
    <text x="6.55" y="6.37">9</text>
    <text x="4.25" y="8.62">10</text>
  </g>

  <text x="4.25" y="9.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.14" fill="#111111">Draw &amp; fire, 3.0s par: 1) 1 shot 2) 2 shots 7) 2 shots 8) 2 shots</text>
  <text x="4.25" y="9.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.14" fill="#111111">Strong hand only, 3.0s: 3) 1 shot 4) 2 shots — Weak hand only, 3.0s: 5) 1 shot 6) 2 shots</text>
  <text x="4.25" y="10.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.14" fill="#111111">Draw, 2 shots + reload + 2 shots, 8.0s par: 9) and 10)</text>
  <text x="4.25" y="10.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.12" fill="#777777">Goal: every hit stays inside its dot. Miss or blow the par time — restart that string.</text>

  <line x1="0.5" y1="10.42" x2="1.5" y2="10.42" stroke="#111111" stroke-width="0.02"/>
  <line x1="0.5" y1="10.36" x2="0.5" y2="10.48" stroke="#111111" stroke-width="0.02"/>
  <line x1="1.5" y1="10.36" x2="1.5" y2="10.48" stroke="#111111" stroke-width="0.02"/>
  <text x="1.0" y="10.62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.12" fill="#555555">1 IN — verify scale before use</text>

  <text x="4.25" y="10.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.12" fill="#777777">Range Roulette · Beyond The Barrel Concepts</text>
  <text x="4.25" y="10.96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.11" fill="#999999">Print at 100% / Actual Size — do not "fit to page"</text>
</svg>
