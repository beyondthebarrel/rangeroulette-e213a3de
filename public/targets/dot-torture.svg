<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8.5 11" width="8.5in" height="11in">
  <rect x="0" y="0" width="8.5" height="11" fill="#ffffff"/>

  <text x="4.25" y="0.55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.34" font-weight="700" fill="#111111">DOT TORTURE TARGET</text>
  <text x="4.25" y="0.82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.15" fill="#555555">10 strings, 1 dot each — recommended distance 3-5 yards</text>

  <!-- Row 1: dots 1-5 -->
  <circle cx="0.75" cy="2.4" r="0.45" fill="none" stroke="#111111" stroke-width="0.03"/>
  <text x="0.75" y="2.55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.4" font-weight="700" fill="#111111">1</text>
  <circle cx="2.5" cy="2.4" r="0.45" fill="none" stroke="#111111" stroke-width="0.03"/>
  <text x="2.5" y="2.55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.4" font-weight="700" fill="#111111">2</text>
  <circle cx="4.25" cy="2.4" r="0.45" fill="none" stroke="#111111" stroke-width="0.03"/>
  <text x="4.25" y="2.55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.4" font-weight="700" fill="#111111">3</text>
  <circle cx="6.0" cy="2.4" r="0.45" fill="none" stroke="#111111" stroke-width="0.03"/>
  <text x="6.0" y="2.55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.4" font-weight="700" fill="#111111">4</text>
  <circle cx="7.75" cy="2.4" r="0.45" fill="none" stroke="#111111" stroke-width="0.03"/>
  <text x="7.75" y="2.55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.4" font-weight="700" fill="#111111">5</text>

  <!-- Row 2: dots 6-10 -->
  <circle cx="0.75" cy="4.6" r="0.45" fill="none" stroke="#111111" stroke-width="0.03"/>
  <text x="0.75" y="4.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.4" font-weight="700" fill="#111111">6</text>
  <circle cx="2.5" cy="4.6" r="0.45" fill="none" stroke="#111111" stroke-width="0.03"/>
  <text x="2.5" y="4.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.4" font-weight="700" fill="#111111">7</text>
  <circle cx="4.25" cy="4.6" r="0.45" fill="none" stroke="#111111" stroke-width="0.03"/>
  <text x="4.25" y="4.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.4" font-weight="700" fill="#111111">8</text>
  <circle cx="6.0" cy="4.6" r="0.45" fill="none" stroke="#111111" stroke-width="0.03"/>
  <text x="6.0" y="4.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.4" font-weight="700" fill="#111111">9</text>
  <circle cx="7.75" cy="4.6" r="0.45" fill="none" stroke="#111111" stroke-width="0.03"/>
  <text x="7.75" y="4.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.36" font-weight="700" fill="#111111">10</text>

  <line x1="0.6" y1="5.35" x2="7.9" y2="5.35" stroke="#cccccc" stroke-width="0.015"/>

  <text x="4.25" y="5.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.18" font-weight="700" fill="#111111">RUN EACH STRING ON ITS OWN DOT</text>

  <text x="0.9" y="6.25" font-family="Arial, Helvetica, sans-serif" font-size="0.16" fill="#111111"><tspan font-weight="700">1</tspan> — Draw, 1 shot, 3.0s par</text>
  <text x="0.9" y="6.7" font-family="Arial, Helvetica, sans-serif" font-size="0.16" fill="#111111"><tspan font-weight="700">2</tspan> — Draw, 2 shots, 3.0s par</text>
  <text x="0.9" y="7.15" font-family="Arial, Helvetica, sans-serif" font-size="0.16" fill="#111111"><tspan font-weight="700">3</tspan> — Strong hand only, 1 shot, 3.0s</text>
  <text x="0.9" y="7.6" font-family="Arial, Helvetica, sans-serif" font-size="0.16" fill="#111111"><tspan font-weight="700">4</tspan> — Strong hand only, 2 shots, 3.0s</text>
  <text x="0.9" y="8.05" font-family="Arial, Helvetica, sans-serif" font-size="0.16" fill="#111111"><tspan font-weight="700">5</tspan> — Weak hand only, 1 shot, 3.0s</text>

  <text x="4.6" y="6.25" font-family="Arial, Helvetica, sans-serif" font-size="0.16" fill="#111111"><tspan font-weight="700">6</tspan> — Weak hand only, 2 shots, 3.0s</text>
  <text x="4.6" y="6.7" font-family="Arial, Helvetica, sans-serif" font-size="0.16" fill="#111111"><tspan font-weight="700">7</tspan> — Draw, 2 shots, 3.0s par</text>
  <text x="4.6" y="7.15" font-family="Arial, Helvetica, sans-serif" font-size="0.16" fill="#111111"><tspan font-weight="700">8</tspan> — Draw, 2 shots, 3.0s par</text>
  <text x="4.6" y="7.6" font-family="Arial, Helvetica, sans-serif" font-size="0.16" fill="#111111"><tspan font-weight="700">9</tspan> — Draw, 2 + reload + 2 shots, 8.0s</text>
  <text x="4.6" y="8.05" font-family="Arial, Helvetica, sans-serif" font-size="0.16" fill="#111111"><tspan font-weight="700">10</tspan> — Draw, 2 + reload + 2 shots, 8.0s</text>

  <text x="4.25" y="8.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.14" fill="#777777">Goal: every hit stays inside its dot. Miss or blow the par time — restart that string.</text>

  <line x1="0.5" y1="10.42" x2="1.5" y2="10.42" stroke="#111111" stroke-width="0.02"/>
  <line x1="0.5" y1="10.36" x2="0.5" y2="10.48" stroke="#111111" stroke-width="0.02"/>
  <line x1="1.5" y1="10.36" x2="1.5" y2="10.48" stroke="#111111" stroke-width="0.02"/>
  <text x="1.0" y="10.62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.12" fill="#555555">1 IN — verify scale before use</text>

  <text x="4.25" y="10.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.12" fill="#777777">Range Roulette · Beyond The Barrel Concepts</text>
  <text x="4.25" y="10.96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.11" fill="#999999">Print at 100% / Actual Size — do not "fit to page"</text>
</svg>
