    <line x1="2.25" y1="1.0" x2="2.25" y2="10.0"/>
    <line x1="2.75" y1="1.0" x2="2.75" y2="10.0"/>
    <line x1="3.25" y1="1.0" x2="3.25" y2="10.0"/>
    <line x1="3.75" y1="1.0" x2="3.75" y2="10.0"/>
    <line x1="4.75" y1="1.0" x2="4.75" y2="10.0"/>
    <line x1="5.25" y1="1.0" x2="5.25" y2="10.0"/>
    <line x1="5.75" y1="1.0" x2="5.75" y2="10.0"/>
    <line x1="6.25" y1="1.0" x2="6.25" y2="10.0"/>
    <line x1="6.75" y1="1.0" x2="6.75" y2="10.0"/>
    <line x1="7.25" y1="1.0" x2="7.25" y2="10.0"/>
    <line x1="7.75" y1="1.0" x2="7.75" y2="10.0"/>
    <line x1="8.25" y1="1.0" x2="8.25" y2="10.0"/>

    <line x1="0.25" y1="1.0" x2="8.25" y2="1.0"/>
    <line x1="0.25" y1="1.5" x2="8.25" y2="1.5"/>
    <line x1="0.25" y1="2.0" x2="8.25" y2="2.0"/>
    <line x1="0.25" y1="2.5" x2="8.25" y2="2.5"/>
    <line x1="0.25" y1="3.0" x2="8.25" y2="3.0"/>
    <line x1="0.25" y1="3.5" x2="8.25" y2="3.5"/>
    <line x1="0.25" y1="4.0" x2="8.25" y2="4.0"/>
    <line x1="0.25" y1="4.5" x2="8.25" y2="4.5"/>
    <line x1="0.25" y1="5.0" x2="8.25" y2="5.0"/>
    <line x1="0.25" y1="6.0" x2="8.25" y2="6.0"/>
    <line x1="0.25" y1="6.5" x2="8.25" y2="6.5"/>
    <line x1="0.25" y1="7.0" x2="8.25" y2="7.0"/>
    <line x1="0.25" y1="7.5" x2="8.25" y2="7.5"/>
    <line x1="0.25" y1="8.0" x2="8.25" y2="8.0"/>
    <line x1="0.25" y1="8.5" x2="8.25" y2="8.5"/>
    <line x1="0.25" y1="9.0" x2="8.25" y2="9.0"/>
    <line x1="0.25" y1="9.5" x2="8.25" y2="9.5"/>
    <line x1="0.25" y1="10.0" x2="8.25" y2="10.0"/>
  </g>

  <rect x="0.25" y="1.0" width="8.0" height="9.0" fill="none" stroke="#999999" stroke-width="0.02"/>

  <line x1="4.25" y1="1.0" x2="4.25" y2="10.0" stroke="#111111" stroke-width="0.025"/>
  <line x1="0.25" y1="5.5" x2="8.25" y2="5.5" stroke="#111111" stroke-width="0.025"/>

  <circle cx="4.25" cy="5.5" r="0.14" fill="none" stroke="#111111" stroke-width="0.025"/>
  <circle cx="4.25" cy="5.5" r="0.04" fill="#111111"/>

  <!-- Horizontal axis ticks (inches from center) -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="0.13" fill="#111111" text-anchor="middle">
    <line x1="3.25" y1="5.4" x2="3.25" y2="5.6" stroke="#111111" stroke-width="0.02"/>
    <text x="3.25" y="5.85">-3</text>
    <line x1="2.25" y1="5.4" x2="2.25" y2="5.6" stroke="#111111" stroke-width="0.02"/>
