<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8.5 11" width="8.5in" height="11in">
  <rect x="0" y="0" width="8.5" height="11" fill="#ffffff"/>

  <text x="4.25" y="0.55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.34" font-weight="700" fill="#111111">ZEROING GRID</text>
  <text x="4.25" y="0.82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="0.15" fill="#555555">1/2" grid, 1" reference ticks — measure group offset from center, then adjust sights</text>

  <g stroke="#cccccc" stroke-width="0.01">
    <line x1="0.25" y1="1.0" x2="0.25" y2="10.0"/>
    <line x1="0.75" y1="1.0" x2="0.75" y2="10.0"/>
    <line x1="1.25" y1="1.0" x2="1.25" y2="10.0"/>
